# Version updates for the npm lockfiles and the pinned actions
# (docs/security-scanning.md). Security updates come from the repository's
# alert settings; these keep pinned versions from going stale.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /spike-m0
    schedule:
      interval: weekly
    # The same seven days pnpm-workspace.yaml waits before taking a new version.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Its WebKit reports a style-src-attr violation for any <select>, even on
      # a page with no style attribute; later releases are still offered.
      - dependency-name: playwright
        versions: ['1.64.0']
      # The types follow the React the repository runs, held below 19.3
      # (stack-evaluation); remove this when React itself moves.
      - dependency-name: '@types/react'
        versions: ['>=19.3.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=19.3.0']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
