# VERIFICATION §7. Every step runs a script from package.json, so CI and a
# local run use the same command (VERIFICATION §1: a check that exists only in
# CI config will drift). Actions are pinned to commit SHAs, not moving tags.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The event is in the group, so a push to main does not cancel the nightly
# run (and its Lighthouse job) on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pushes and PRs run the required job only. The nightly run adds
        # macOS, Windows and the next Node line (VERIFICATION §7).
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        node: ${{ github.event_name == 'schedule' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm (version from packageManager)
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
      # Seconds each, so on every push: the variants and props each emitter
      # implements, and the token benchmark (every corpus site must compile).
      - run: pnpm coverage
      - run: pnpm bench:tokens

  build:
    name: end-to-end build and render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify:build

  visual:
    name: 12-point word gate and thumbnails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Browser builds for the pinned Playwright, plus the OS libraries they need.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm test:visual --self-test
      - run: pnpm gate --self-test
      # All 12 gate items for every word; runs the browser checks itself.
      - run: pnpm gate
      # M4: auth forms, <Protected> and the reset flow against a local mock
      # provider (the real-provider exit criterion needs an account; open).
      - run: pnpm test:auth
      # az dev: site + backend locally with no setup, the dev mailbox, reload
      # on save, and Ctrl-C leaving nothing running.
      - run: pnpm test:dev
      # The 3D runtime: one renderer per page, static never loads it, the
      # model is self-hosted, orbit answers the keyboard, context loss falls
      # back to the posters (scene-spec §5–§9). Software WebGL, so no frame
      # time from here is device evidence.
      - run: pnpm test:3d
      - run: pnpm thumbnails --verify
      # The az palette gallery: policy, axe, keyboard and copy in three
      # engines, and a screenshot per theme rendered twice (theme-spec §14).
      - run: pnpm test:palette

  backend-db:
    name: built-in backend on PostgreSQL and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Pinned images, started and removed by the script (backend-spec §10).
      - run: pnpm test:backend-db

  chat:
    name: chat block end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Three engines over local https (a certificate made at test time), the
      # generated server on the scripted `fake` model (chat-block-spec §12).
      - name: pnpm test:chat
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          pnpm test:chat 2>&1 | tee "$RUNNER_TEMP/logs/test-chat.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-failure
          # The log, and the pixel snapshots (a mismatch keeps its .second.png).
          path: |
            ${{ runner.temp }}/logs/
            .visual-out/chat/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  data:
    name: data tables end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # API, rules, admin, images and `from` blocks in three engines, over
      # local https (a certificate made at test time; data-spec §14).
      - name: pnpm test:data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          pnpm test:data 2>&1 | tee "$RUNNER_TEMP/logs/test-data.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-failure
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 14

  cloud-auth:
    name: hosted auth against the real identity server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      # The pinned server image and its database in Docker, started and
      # removed by the script; the site driven in Chromium (auth-block-spec §3.5).
      - name: pnpm test:cloud-auth
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          pnpm test:cloud-auth 2>&1 | tee "$RUNNER_TEMP/logs/test-cloud-auth.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-auth-failure
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: lighthouse on every preview (nightly)
    # Scores move with the runner's load, so this runs nightly and on demand,
    # alone on its runner, and its results are kept as an artifact. It fails
    # when a site cannot be built or audited, or (--fail-under m5) scores
    # below an M5 target: perf on the median of three runs, a11y, best
    # practices and SEO on every run (VERIFICATION §7).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: pnpm test:lighthouse
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse"
          pnpm test:lighthouse --fail-under m5 --json "$RUNNER_TEMP/lighthouse/results.json" \
            --reports "$RUNNER_TEMP/lighthouse/reports" 2>&1 | tee "$RUNNER_TEMP/lighthouse/test-lighthouse.log"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-results
          path: ${{ runner.temp }}/lighthouse/
          if-no-files-found: ignore
          retention-days: 30
